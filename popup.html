<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brave Dev Tool</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Brave Dev Tool</h1>
    </header>
    
    <main>
      <div class="section">
        <h2>Page Info</h2>
        <div class="info-item">
          <label>URL:</label>
          <span id="current-url" class="copyable" title="Click to copy">Loading...</span>
        </div>
        <div class="info-item">
          <label>Title:</label>
          <span id="page-title" class="copyable" title="Click to copy">Loading...</span>
        </div>
      </div>

      <div class="section">
        <h2>Actions</h2>
        <button id="refresh-btn" class="btn btn-primary">Refresh Page</button>
        <button id="console-btn" class="btn btn-secondary">Console Helper (F12)</button>
        <button id="clear-storage-btn" class="btn btn-danger">Clear Storage</button>
      </div>

      <div class="section">
        <h2>Developer Tools</h2>
        <button id="inspect-btn" class="btn btn-primary">🔍 Inspect Element</button>
        <button id="network-btn" class="btn btn-secondary">🌐 Network Monitor</button>
        <button id="expand-sections-btn" class="btn btn-secondary">📂 Expand Sections</button>
      </div>
    </main>

    <footer>
      <p>Version 1.0.0</p>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
